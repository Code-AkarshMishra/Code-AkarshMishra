# Save as: .github/workflows/blog-posts.yml  (in the Code-AkarshMishra/Code-AkarshMishra repo)
name: Latest Blog Posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/codeakarshmishra"
          max_post_count: 5
          comment_tag_name: "BLOG-POST"
