name: Latest Blog Posts Feed Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check DEV feed without failing the workflow
        shell: bash
        run: |
          FEED_URL="https://dev.to/feed/codeakarshmishmra"
          if curl --location --silent --show-error --fail --max-time 15 "$FEED_URL" -o /tmp/dev-feed.xml; then
            echo "DEV feed responded successfully. Confirm the URL before enabling blog automation."
            head -c 220 /tmp/dev-feed.xml || true
          else
            echo "::warning::DEV feed returned an error or is unavailable. Workflow will remain successful; README was not modified."
          fi
