name: Latest Blog Posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check DEV feed availability without failing the profile build
        shell: bash
        run: |
          set -euo pipefail
          FEED_URL="https://dev.to/feed/codeakarshmishra"
          STATUS="$(curl -L -sS -o /tmp/dev-feed.xml -w '%{http_code}' --max-time 20 "$FEED_URL" || true)"
          if [[ "$STATUS" == "200" ]] && grep -q '<rss\|<feed\|<channel' /tmp/dev-feed.xml; then
            echo "DEV RSS feed responds successfully."
          else
            echo "::notice::DEV RSS feed unavailable (HTTP ${STATUS:-unknown}). Skipping blog refresh; profile remains unaffected."
          fi
