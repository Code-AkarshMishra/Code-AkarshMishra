<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Player One Has Entered the Game</title><desc id="desc">A neon green and violet terminal arcade banner for Akarsh Mishra.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101729"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#20143b"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5a8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a5b4fc" stroke-opacity=".10"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="5" y="5" width="1190" height="370" rx="24" fill="url(#bg)" stroke="#36415d" stroke-width="2"/>
<rect x="5" y="5" width="1190" height="370" rx="24" fill="url(#grid)"/>
<rect x="42" y="38" width="1116" height="34" rx="8" fill="#080e1d" stroke="#35415d"/>
