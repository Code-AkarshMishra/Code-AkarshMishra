<text x="56" y="195" fill="#f3f6ff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">PLAYER ONE HAS</text>
<text x="56" y="255" fill="url(#neon)" filter="url(#glow)" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">ENTERED THE GAME</text>
