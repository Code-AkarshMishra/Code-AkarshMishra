<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Akarsh Mishra — Retro Developer World</title>
<desc id="desc">A retro pixel-art world with grass blocks, a wooden workbench, a computer setup, and Akarsh's developer roles.</desc>
