<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" ><stop offset="0" stop-color="#0000"/><stop offset="0.5" stop-color="#00f7ff"/><stop offset="1" stop-color="#0000"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/></linearGradient>
