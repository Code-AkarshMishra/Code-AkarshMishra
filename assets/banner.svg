<radialGradient id="g1"><stop offset="0" stop-color="#00f7ff" stop-opacity=".45"/><stop offset="1" stop-color="#00f7ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#7b2ff7" stop-opacity=".55"/><stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/></radialGradient>
