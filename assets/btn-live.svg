<svg xmlns="http://www.w3.org/2000/svg" width="230" height="60" viewBox="0 0 230 60" role="img" aria-label="btn-live">
<defs>

<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="lc"><rect x="2" y="2" width="226" height="56" rx="30"/></clipPath>

</defs>

<rect x="2" y="2" width="226" height="56" rx="30" fill="url(#lg)"/>
<g clip-path="url(#lc)"><rect x="-80" y="0" width="80" height="60" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" from="-120" to="290" dur="2.8s" repeatCount="indefinite"/></rect></g>
<text x="115.0" y="38" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#07101f">🚀  Live Demo</text>

</svg>
