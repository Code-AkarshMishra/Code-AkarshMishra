<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" role="img" aria-label="p-weathergpt">
<defs>

<linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a31"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
<linearGradient id="br" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" ><stop offset="0" stop-color="#ff6b35"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff6b35"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="bl"><stop offset="0" stop-color="#ff6b35" stop-opacity=".5"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect x="2" y="2" width="456" height="326" rx="22"/></clipPath>

</defs>

<rect x="2" y="2" width="456" height="326" rx="22" fill="url(#cb)"/>
<g clip-path="url(#cp)">
  <circle cx="420" cy="40" r="150" fill="url(#bl)"><animate attributeName="r" values="130;170;130" dur="6s" repeatCount="indefinite"/></circle>
  <rect x="2" y="2" width="6" height="326" fill="#ff6b35"/>
</g>
<rect x="2" y="2" width="456" height="326" rx="22" fill="none" stroke="url(#br)" stroke-width="3"/>
<circle cx="64" cy="62" r="34" fill="#ff6b35" fill-opacity=".16" stroke="#ff6b35" stroke-opacity=".5"/>
<text x="64" y="76" text-anchor="middle" font-size="36">🌦️</text>
<rect x="319" y="44" width="113" height="34" rx="17" fill="#ffffff" fill-opacity=".07"/>
<circle cx="339" cy="61" r="5" fill="#ff6b35"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="353" y="67" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#d9e6ff">Project</text>
<text x="28" y="140" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="33" font-weight="800" fill="#ffffff">WeatherGPT</text>
<text x="28" y="176" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#b9c8e2">Conversational AI weather assistant</text>
<rect x="28" y="240" width="56" height="34" rx="17" fill="#ff6b35" fill-opacity=".14" stroke="#ff6b35" stroke-opacity=".55"/><text x="56" y="263" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eaf1ff">LLM</text><rect x="94" y="240" width="56" height="34" rx="17" fill="#ff6b35" fill-opacity=".14" stroke="#ff6b35" stroke-opacity=".55"/><text x="122" y="263" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eaf1ff">API</text><rect x="160" y="240" width="122" height="34" rx="17" fill="#ff6b35" fill-opacity=".14" stroke="#ff6b35" stroke-opacity=".55"/><text x="221" y="263" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eaf1ff">JavaScript</text>
<text x="28" y="312" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ff6b35">View repository
