<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" role="img" aria-label="p-prepbot">
<defs>

<linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a31"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
<linearGradient id="br" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" ><stop offset="0" stop-color="#2ee59d"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#2ee59d"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="bl"><stop offset="0" stop-color="#2ee59d" stop-opacity=".5"/><stop offset="1" stop-color="#2ee59d" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect x="2" y="2" width="456" height="326" rx="22"/></clipPath>

</defs>

<rect x="2" y="2" width="456" height="326" rx="22" fill="url(#cb)"/>
